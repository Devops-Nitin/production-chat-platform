apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: production-chat

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: backend
          image: nsmachine/production:backend-v1
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: backend-configmap

            - secretRef:
                name: backend-secret

          volumeMounts:
            - name: backend-uploads
              mountPath: /app/uploads

      volumes:
        - name: backend-uploads
          emptyDir: {}
