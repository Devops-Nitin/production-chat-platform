name: ChatSphere AI CI/CD GitOps Pipeline

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: write

env:
  DOCKER_IMAGE: nsmachine/production

jobs:
  build-push-update-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tags
        run: |
          echo "BACKEND_TAG=backend-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "FRONTEND_TAG=frontend-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t $DOCKER_IMAGE:$BACKEND_TAG ./backend
          docker push $DOCKER_IMAGE:$BACKEND_TAG

      - name: Build and Push Frontend Image
        run: |
          docker build -t $DOCKER_IMAGE:$FRONTEND_TAG ./frontend
          docker push $DOCKER_IMAGE:$FRONTEND_TAG

      - name: Update Kubernetes Manifests
        run: |
          sed -i "s|image: nsmachine/production:backend-.*|image: nsmachine/production:$BACKEND_TAG|g" k8s/backend-deployment.yaml
          sed -i "s|image: nsmachine/production:backend-v1|image: nsmachine/production:$BACKEND_TAG|g" k8s/backend-deployment.yaml

          sed -i "s|image: nsmachine/production:frontend-.*|image: nsmachine/production:$FRONTEND_TAG|g" k8s/frontend-deployment.yaml
          sed -i "s|image: nsmachine/production:frontend-v13|image: nsmachine/production:$FRONTEND_TAG|g" k8s/frontend-deployment.yaml

      - name: Commit Updated Manifests
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore: update image tags for ArgoCD deployment"
            git push origin develop
          fi
