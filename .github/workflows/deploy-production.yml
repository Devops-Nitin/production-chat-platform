name: ChatSphere AI CI/CD GitOps Pipeline

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - "helm/chatsphere-ai/**"
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: write

env:
  DOCKER_IMAGE: nsmachine/production

jobs:
  build-push-update-helm-values:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tags
        run: |
          echo "BACKEND_TAG=backend-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "FRONTEND_TAG=frontend-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t $DOCKER_IMAGE:$BACKEND_TAG ./backend
          docker push $DOCKER_IMAGE:$BACKEND_TAG

      - name: Build and Push Frontend Image
        run: |
          docker build -t $DOCKER_IMAGE:$FRONTEND_TAG ./frontend
          docker push $DOCKER_IMAGE:$FRONTEND_TAG

      - name: Update Helm Production Values
        run: |
          sed -i "/backend:/,/service:/ s|tag: .*|tag: $BACKEND_TAG|g" helm/chatsphere-ai/values-prod.yaml
          sed -i "/frontend:/,/service:/ s|tag: .*|tag: $FRONTEND_TAG|g" helm/chatsphere-ai/values-prod.yaml

      - name: Validate Helm Chart
        run: |
          helm lint helm/chatsphere-ai
          helm template chatsphere-ai helm/chatsphere-ai -f helm/chatsphere-ai/values-prod.yaml > /tmp/chatsphere-rendered.yaml

      - name: Commit Updated Helm Values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/chatsphere-ai/values-prod.yaml

          if git diff --cached --quiet; then
            echo "No Helm values changes to commit"
          else
            git commit -m "chore: update Helm image tags for ArgoCD deployment"
            git push origin develop
          fi
