version: "3.9"

services:
  mongo:
    image: mongo:8
    container_name: chat-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Admin@123

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend

    container_name: chat-backend
    restart: unless-stopped

    depends_on:
      - mongo
      - redis

    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://admin:Admin%40123@mongo:27017/chatapp?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: chatapp_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000

    ports:
      - "5000:5000"

    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api

    container_name: chat-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  mongo_data:
  backend_uploads:
